<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jarvis</title>
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#060b18">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jarvis">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #060b18; --bg-2: #0b1226; --panel: rgba(120, 170, 220, .09);
    --cyan: #5ee0cb; --cyan-dim: #6fb3a8; --cyan-faint: rgba(94, 224, 203, .12);
    --text: #e9f3ff; --muted: #a6b8cf; --ok: #4dffb8; --warn: #ffb547; --line: rgba(160, 210, 255, .2);
    --display: "Inter", "Segoe UI", system-ui, sans-serif;
    --body: "Inter", "Segoe UI", system-ui, sans-serif;
    --mono: "JetBrains Mono", Consolas, ui-monospace, monospace;
    --glow: 0 0 14px rgba(94, 224, 203, .28);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body { margin: 0; min-height: 100vh; color: var(--text); font: 15px/1.5 var(--body); }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(60vw 50vh at 8% 78%, rgba(18, 165, 143, .38), transparent 70%),
      radial-gradient(65vw 60vh at 92% 6%, rgba(106, 63, 214, .42), transparent 70%),
      radial-gradient(45vw 40vh at 62% 88%, rgba(36, 96, 216, .3), transparent 70%);
  }
  /* --- Glass --- */
  header, .stat, .card, .quick-item, .msg, pre, .table-wrap {
    -webkit-backdrop-filter: blur(18px) saturate(170%); backdrop-filter: blur(18px) saturate(170%); }
  .stat, .card, .quick-item, .msg, pre, .table-wrap, .share-box { border-radius: 14px; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .07); }
  .link, .act, nav button, .icon-btn, input[type=search], select, textarea, .toolbar input { border-radius: 9px; }
  .chip { border-radius: 999px; }

  header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: rgba(6, 11, 24, .55);
           border-bottom: 1px solid var(--line); }
  .bar { max-width: 1240px; margin: 0 auto; padding-block: 12px;
         padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; gap: 14px;
         align-items: center; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .brand .mini-core { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--cyan);
                      box-shadow: var(--glow), inset 0 0 10px var(--cyan); position: relative; }
  .brand .mini-core::after { content: ""; position: absolute; inset: 7px; border-radius: 50%;
                             background: var(--cyan); box-shadow: 0 0 12px var(--cyan); }
  h1 { font: 600 16px var(--display); margin: 0; letter-spacing: .2em; color: var(--text); }
  nav { display: flex; gap: 2px; flex-wrap: wrap; }
  nav button { border: 1px solid transparent; background: none; color: var(--muted); padding: 5px 12px;
               cursor: pointer; font: 500 13px var(--display); transition: color .2s, background .2s; }
  nav button:hover { color: var(--text); }
  nav button.active { color: var(--text); background: rgba(94,224,203,.2); }
  .spacer { flex: 1; }
  input[type=search] { background: rgba(8, 26, 44, .8); color: var(--text); border: 1px solid var(--line);
                       padding: 7px 12px; width: 220px; font: 14px var(--mono); outline: none; }
  input[type=search]:focus { border-color: var(--cyan); box-shadow: var(--glow); }
  input[type=search]::placeholder { color: var(--muted); }
  .icon-btn { background: none; border: 1px solid var(--line); color: var(--cyan); padding: 5px 11px;
              cursor: pointer; font: 16px var(--mono); }
  .icon-btn:hover { box-shadow: var(--glow); border-color: var(--cyan); }

  main { max-width: 1240px; margin: 0 auto; padding-block: 24px 130px;  /* room for Wisp at the bottom */
         padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); position: relative; z-index: 1; }

  /* --- Arc reactor hero --- */
  .hero { display: grid; grid-template-columns: 1fr auto 1fr; gap: 28px; align-items: center; margin: 8px 0 36px;
          min-height: calc(100vh - 220px); align-content: center; }
  .hud-col { display: flex; flex-direction: column; gap: 14px; }
  .hud-col.left { align-items: flex-end; }
  .reactor { width: 300px; height: 300px; position: relative; display: grid; place-items: center; }
  .reactor .ring { position: absolute; border-radius: 50%; }
  .r1 { inset: 0; border: 2px solid var(--cyan-dim); box-shadow: 0 0 40px rgba(94,224,203,.15), inset 0 0 30px rgba(94,224,203,.12); }
  .r2 { inset: 14px; border: 6px dashed rgba(94,224,203,.35); animation: spin 40s linear infinite; }
  .r3 { inset: 42px; border: 2px solid var(--cyan); border-left-color: transparent; border-right-color: transparent;
        box-shadow: var(--glow); animation: spin 12s linear infinite reverse; }
  .r4 { inset: 62px; border: 10px solid transparent; border-top-color: rgba(94,224,203,.55); border-bottom-color: rgba(94,224,203,.55);
        animation: spin 7s linear infinite; }
  .r5 { inset: 86px; background: radial-gradient(circle, rgba(94,224,203,.22), rgba(120,170,220,.08) 70%);
        border: 3px solid var(--cyan); box-shadow: 0 0 30px var(--cyan), inset 0 0 30px rgba(94,224,203,.55); }
  .reactor .label { position: relative; font: 700 21px var(--display); letter-spacing: .2em; color: #eafaff;
                    text-shadow: 0 0 8px var(--cyan), 0 0 20px var(--cyan); padding-left: .2em; }
  .reactor .sub { position: absolute; bottom: 104px; font: 10px var(--mono); color: var(--cyan); letter-spacing: .3em; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 50% { opacity: .55; } }

  .stat { position: relative; min-width: 200px; padding: 10px 16px; cursor: pointer; background: var(--panel);
          border: 1px solid var(--line);
          transition: border-color .2s, box-shadow .2s; }
  .stat:hover { border-color: var(--cyan); box-shadow: var(--glow); }
  .stat b { display: block; font: 600 30px var(--display); color: var(--cyan); font-variant-numeric: tabular-nums; }
  .stat small { font: 12px var(--mono); color: var(--muted); }
  .hud-col.left .stat { text-align: right; }

  .status-line { font: 13px var(--mono); color: var(--muted); text-align: center; margin: -18px 0 30px; }
  .status-line .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ok);
                      box-shadow: 0 0 8px var(--ok); margin-right: 8px; animation: pulse 2s ease-in-out infinite; }

  /* --- Sections & cards --- */
  h2 { font: 600 15px var(--display); color: var(--cyan);
       margin: 34px 0 14px; display: flex; align-items: center; gap: 12px; }
  h2::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--line), transparent); }
  h2 .count { font: 13px var(--mono); color: var(--muted); text-shadow: none; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px; }
  .card { position: relative; background: var(--panel); border: 1px solid var(--line); padding: 14px 16px; min-width: 0; transition: border-color .2s, box-shadow .2s; }
  .card:hover { border-color: rgba(94,224,203,.6); box-shadow: inset 0 0 24px rgba(94,224,203,.08); }
  .card h3 { margin: 0 0 4px; font: 600 17px var(--body); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .card p { margin: 6px 0 0; color: var(--muted); }
  .desc { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  [data-expand] { cursor: pointer; }
  .card.open .desc { -webkit-line-clamp: unset; }
  .path { font: 12px var(--mono); color: var(--cyan-dim); word-break: break-all; }
  .chip { display: inline-block; border: 1px solid var(--line); color: var(--muted); padding: 0 8px;
          font: 11px var(--mono); }
  .chip.ok { color: var(--ok); border-color: rgba(77,255,184,.4); }
  .chip.warn { color: var(--warn); border-color: rgba(255,181,71,.4); }
  .chip.accent { color: var(--cyan); border-color: rgba(94,224,203,.5); }
  .row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .links { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .link { font: 600 12px var(--display); text-decoration: none;
          color: var(--cyan); border: 1px solid rgba(94,224,203,.5); padding: 4px 10px; transition: background .2s, color .2s; }
  .link:hover { background: var(--cyan); color: var(--bg); box-shadow: var(--glow); }
  .link.web { background: rgba(94,224,203,.16); }
  .link.local { color: var(--warn); border-color: rgba(255,181,71,.45); }
  .link.local:hover { background: var(--warn); color: var(--bg); }
  .link.local::after { content: " · PC"; opacity: .7; }
  .act { font: 600 11px var(--display); cursor: pointer;
         color: var(--text); background: rgba(94,224,203,.06); border: 1px solid var(--line); padding: 4px 9px; transition: background .2s, color .2s; }
  .act:hover { background: var(--cyan); color: var(--bg); box-shadow: var(--glow); }
  .act.on { color: var(--ok); border-color: rgba(77,255,184,.45); }
  .act.off { color: var(--warn); border-color: rgba(255,181,71,.45); }
  .act:disabled { opacity: .5; cursor: wait; }
  ul.sessions .act { float: right; margin-left: 8px; }
  #out { position: fixed; z-index: 6; right: 16px; bottom: 16px; width: min(520px, calc(100% - 32px)); margin: 0;
         max-height: 40vh; overflow: auto; background: rgba(6, 11, 24, .94); border-color: var(--cyan); box-shadow: var(--glow); }
  #out button { float: right; }
  .quick { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
  .quick-item { display: flex; flex-direction: column; gap: 2px; padding: 14px 16px; text-decoration: none;
                color: var(--text); background: rgba(94,224,203,.08); border: 1px solid rgba(94,224,203,.5);
                transition: background .2s, box-shadow .2s; }
  .quick-item b { font: 600 15px var(--display); display: flex; align-items: center; gap: 8px; }
  .app-icon { width: 26px; height: 26px; border-radius: 50%; flex: none; }
  .quick-item small { font: 12px var(--mono); color: var(--cyan); }
  .quick-item:hover, .quick-item:focus-visible { background: rgba(94,224,203,.2); box-shadow: var(--glow); outline: none; }
  .quick-item.local { border-color: rgba(255,181,71,.45); background: rgba(255,181,71,.06); }
  .quick-item.local small { color: var(--warn); }
  .quick-cell { display: flex; flex-direction: column; }
  .quick-cell .quick-item { flex: 1; }
  .quick-actions { display: flex; justify-content: flex-end; gap: 12px; }
  .share-link { background: none; border: none; cursor: pointer; padding: 6px 2px 0;
                color: var(--muted); font: 11px var(--mono); }
  .share-link:hover { color: var(--cyan); }
  #share { position: fixed; inset: 0; z-index: 7; display: grid; place-items: center; padding: 16px; background: rgba(6, 11, 24, .88); }
  #share[hidden] { display: none; }
  .share-box { width: min(340px, 100%); padding: 20px; text-align: center; background: var(--bg-2);
               border: 1px solid var(--cyan); box-shadow: var(--glow); }
  .share-box h3 { margin: 0 0 12px; font: 600 15px var(--display); }
  /* --- v4: PC state under the reactor, command bar (Ctrl+K) --- */
  .pc { display: flex; justify-content: center; flex-wrap: wrap; gap: 14px 28px; margin: -18px 0 30px; font: 12px var(--mono); color: var(--muted); }
  .pc span { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; width: 140px; }
  .pc b { color: var(--cyan); font-weight: 500; }
  .pc i { grid-column: 1 / -1; height: 3px; border-radius: 2px; background: linear-gradient(90deg, var(--cyan) var(--v), var(--line) 0); }
  #palette { position: fixed; inset: 0; z-index: 7; display: grid; justify-items: center; align-items: start;
             padding: 12vh 16px 16px; background: rgba(6, 11, 24, .75); }
  #palette[hidden] { display: none; }
  .palette-box { width: min(560px, 100%); padding: 10px; border-radius: 14px; background: var(--bg-2); border: 1px solid var(--line); }
  .palette-box .toolbar { margin-bottom: 6px; }
  .pal-item { display: flex; justify-content: space-between; gap: 12px; width: 100%; padding: 8px 10px; border: 0; border-radius: 9px;
              background: none; color: var(--text); font: 14px var(--body); text-align: left; text-decoration: none; cursor: pointer; }
  .pal-item small { color: var(--muted); font: 12px var(--mono); }
  .pal-item.sel, .pal-item:hover { background: rgba(94, 224, 203, .14); }
  .share-box .qr svg { display: block; width: 100%; height: auto; background: #fff; }  /* dark on white: scans everywhere */
  .share-box .path { margin: 10px 0 4px; }
  a:focus-visible, button:focus-visible, .stat:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  ul.sessions { list-style: none; padding: 0; margin: 10px 0 0; border-top: 1px dashed var(--line); }
  ul.sessions li { padding: 7px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
  ul.sessions time { color: var(--cyan-dim); font: 11px var(--mono); display: block; }
  pre { background: var(--panel); border: 1px solid var(--line); padding: 14px; white-space: pre-wrap; word-break: break-word;
        font: 13px var(--mono); color: var(--text); }
  .empty { color: var(--muted); font: 13px var(--mono); }
  .note { color: var(--muted); font: 12px var(--mono); }

  /* --- Roadmap --- */
  .roadmap { position: relative; display: grid; gap: 18px; padding-left: 34px; }
  .roadmap::before { content: ""; position: absolute; left: 11px; top: 8px; bottom: 8px; width: 2px;
                     background: linear-gradient(var(--cyan), var(--cyan-dim) 30%, rgba(94,224,203,.1)); }
  .phase { position: relative; }
  .phase .node { position: absolute; left: -34px; top: 14px; width: 24px; height: 24px; border-radius: 50%;
                 border: 2px solid var(--cyan-dim); background: var(--bg); }
  .phase.live .node { border-color: var(--cyan); box-shadow: var(--glow); }
  .phase.live .node::after { content: ""; position: absolute; inset: 5px; border-radius: 50%; background: var(--cyan); animation: pulse 2s infinite; }
  .phase .card h3 { font: 700 15px var(--display); }
  .phase:not(.live) .card { opacity: .82; }
  .phase ul { margin: 10px 0 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 6px 18px; }
  .phase li { padding-left: 16px; position: relative; color: var(--text); }
  .phase li::before { content: "›"; position: absolute; left: 0; color: var(--cyan); }
  .phase li small { display: block; color: var(--muted); font-size: 13px; }

  /* --- v3: chat, usage, search, git (local page only) --- */
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  select, textarea, .toolbar input { background: rgba(8, 26, 44, .8); color: var(--text); border: 1px solid var(--line);
                                     padding: 7px 10px; font: 14px var(--mono); outline: none; }
  select:focus, textarea:focus, .toolbar input:focus { border-color: var(--cyan); box-shadow: var(--glow); }
  .toolbar input { flex: 1; min-width: 0; }
  textarea { width: 100%; resize: vertical; }
  .chat-log { display: grid; gap: 10px; max-height: 60vh; overflow: auto; margin-bottom: 12px; }
  .msg { white-space: pre-wrap; word-break: break-word; padding: 10px 14px; border: 1px solid var(--line); background: var(--panel); }
  .msg.user { border-color: rgba(255,181,71,.45); justify-self: end; max-width: 85%; }
  .msg small { display: block; font: 11px var(--mono); color: var(--cyan); margin-bottom: 4px; }
  .msg.user small { color: var(--warn); }
  .msg .err { color: var(--warn); }
  .bars { display: flex; align-items: flex-end; gap: 6px; height: 220px; padding-top: 8px; border-bottom: 1px solid var(--line); }
  .bars .col { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; }
  .bars .stack { display: flex; flex-direction: column-reverse; min-height: 1px; box-shadow: var(--glow); }
  .bars small { font: 10px var(--mono); color: var(--muted); text-align: center; margin-top: 4px; white-space: nowrap; overflow: hidden; }
  .bars .val { font: 10px var(--mono); color: var(--cyan); text-align: center; margin-bottom: 2px; overflow: hidden; }
  .legend i, .hbar i { display: inline-block; height: 10px; }
  .legend i { width: 10px; margin: 0 4px 0 10px; vertical-align: middle; }
  table.usage { width: 100%; border-collapse: collapse; font: 13px var(--mono); }
  table.usage td, table.usage th { padding: 5px 8px; border-bottom: 1px dashed var(--line); text-align: right; white-space: nowrap; }
  table.usage th { color: var(--cyan); font-weight: normal; }
  table.usage td:first-child, table.usage th:first-child { text-align: left; white-space: normal; }
  .hbar { width: 30%; } .hbar i { background: var(--cyan); box-shadow: var(--glow); }
  .table-wrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); padding: 8px; }
  mark { background: rgba(94,224,203,.3); color: var(--text); }

  @media (max-width: 900px) {
    .hero { grid-template-columns: 1fr; justify-items: center; min-height: 0; }
    .hud-col { flex-direction: row; flex-wrap: wrap; justify-content: center; }
    .hud-col.left { align-items: stretch; order: 2; }
    .hud-col.right { order: 3; }
    .hud-col.left .stat { text-align: left; }
    .stat { min-width: 150px; }
  }
  @media (max-width: 600px) {
    .bar { gap: 10px; }
    nav { order: 3; width: 100%; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
    nav button { flex: none; }
    .spacer { display: none; }
    input[type=search] { flex: 1; width: auto; min-width: 0; }
    .grid { grid-template-columns: 1fr; }
    .reactor { width: 240px; height: 240px; }
    .r5 { inset: 66px; } .r4 { inset: 46px; } .r3 { inset: 30px; }
    .reactor .label { font-size: 16px; } .reactor .sub { bottom: 80px; }
  }
  /* --- Wisp, the mascot (prototype: wisp.html). transform/opacity only, ease-out. --- */
  .wisp { --ease-out: cubic-bezier(0.23, 1, 0.32, 1); --a: #5DCAA5; --b: #9FE1CB; --k: #04342C;
          position: fixed; z-index: 4; left: max(16px, env(safe-area-inset-left, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px));
          width: 96px; height: 96px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .wisp svg { width: 100%; height: 100%; overflow: visible; }
  .wisp svg * { transform-box: fill-box; }
  .wisp[data-mood=angry] { --a: #E24B4A; --b: #F09595; --k: #501313; }
  .wisp[data-mood=gg] { --a: #EF9F27; --b: #FAC775; --k: #412402; }
  .wisp[data-mood=sleep] { --a: #378ADD; --b: #B5D4F4; --k: #042C53; }
  .wisp .fa { fill: var(--a); } .wisp .fb { fill: var(--b); } .wisp .fk { fill: var(--k); } .wisp .sk { stroke: var(--k); }
  .wisp .fa, .wisp .fb, .wisp .fk { transition: fill 250ms ease; } .wisp .sk { transition: stroke 250ms ease; }
  .wisp .float { animation: w-float 3.2s cubic-bezier(0.77, 0, 0.175, 1) infinite alternate; }
  .wisp .flame { transform-origin: 50% 100%; animation: w-flick 1.4s ease-in-out infinite alternate; transition: transform 250ms var(--ease-out); }
  .wisp[data-mood=angry] .flame { transform: scale(1.08, 1.16); animation-duration: .32s; }
  .wisp[data-mood=sleep] .flame { transform: scale(1, .92); animation-duration: 3s; }
  .wisp[data-mood=gg] .float { animation: w-hop .5s var(--ease-out) infinite alternate; }
  .wisp[data-mood=angry] .float { animation: w-rage .09s linear infinite alternate; }
  @keyframes w-float { to { transform: translateY(-8px); } }
  @keyframes w-flick { to { transform: scale(.97, 1.04); } }
  @keyframes w-hop { to { transform: translateY(-14px); } }
  @keyframes w-rage { to { transform: translateX(2px); } }
  .wisp .e { opacity: 0; transition: opacity 150ms var(--ease-out); }
  .wisp[data-mood=idle] .e-idle, .wisp[data-mood=sly] .e-sly, .wisp[data-mood=think] .e-think, .wisp[data-mood=sleep] .e-sleep,
  .wisp[data-mood=wow] .e-wow, .wisp[data-mood=angry] .e-angry, .wisp[data-mood=gg] .e-gg { opacity: 1; }
  .wisp .blink { transform-origin: 50% 50%; animation: w-blink 4.5s infinite; }
  @keyframes w-blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
  .wisp .fx { opacity: 0; transition: opacity 200ms ease; }
  .wisp[data-mood=angry] .fx-angry, .wisp[data-mood=sleep] .fx-sleep, .wisp[data-mood=gg] .fx-gg, .wisp[data-mood=think] .fx-think { opacity: 1; }
  .wisp .rise { animation: w-rise 1.6s ease-out infinite; }
  .wisp .rise:nth-child(2) { animation-delay: .5s; } .wisp .rise:nth-child(3) { animation-delay: 1s; }
  @keyframes w-rise { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-30px); opacity: 0; } }
  .wisp .dot { animation: w-dot 1.2s ease-in-out infinite; }

// Set by snapshot.py in the online copy, which works without the PC.
const SNAPSHOT = window.JARVIS_DATA || null;
// Only the local server puts a token in the page: no token, no action buttons.
const TOKEN = !SNAPSHOT && window.JARVIS_TOKEN;
const TABS = [...BASE_TABS, ...(TOKEN ? LOCAL_TABS : []), ["roadmap", "Évolutions"]];
let data = null, tab = "overview", query = "";
// localhost links only make sense on the PC that serves them.
const visibleLinks = p => (p.links || []).filter(l => !(SNAPSHOT && l.kind === "local"));

function quickAccess() {
  const items = data.projects.flatMap(p => visibleLinks(p)
    .filter(l => l.kind === "web" || l.kind === "custom" || (l.kind === "local" && !SNAPSHOT))
    .map(l => ({ ...l, project: p.name, title: l.name || p.name, icon: p.icon })))
    // Worktrees repeat their project's links: same name and URL make one tile.
    .filter((l, i, all) => all.findIndex(o => o.title === l.title && o.url === l.url) === i);
  if (!items.length) return `<h2>Accès rapide</h2><p class="empty">// aucun lien (voir links.json)</p>`;
  return `<h2>Accès rapide <span class="count">[${items.length}]</span></h2><div class="quick">${items.map(l =>
    `<div class="quick-cell"><a class="quick-item ${l.kind}" href="${esc(l.url)}" target="_blank" rel="noopener">
       <b>${appIcon(l)}${esc(l.title)}</b><small>${esc(l.label.replace(/^.*· /, ""))} ↗</small></a>
       <div class="quick-actions">
         ${TOKEN ? `<button class="share-link" data-act="rename_link" data-project="${esc(l.project)}" data-url="${esc(l.url)}" data-current="${esc(l.title)}">Renommer</button>` : ""}
         ${l.kind === "local" ? "" : `<button class="share-link" data-share="${esc(l.url)}" data-name="${esc(l.title)}">Partager</button>`}
       </div></div>`).join("")}</div>`;
}

// --- Share an app: big QR code, the link, and the phone's own share sheet ---
const QR_LIB = "https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js";
let qrLib = null;  // loaded on the first "Partager" only

async function openShare(url, name) {
  const box = document.getElementById("share");
  box.innerHTML = `<div class="share-box" role="dialog" aria-modal="true" aria-label="Partager ${esc(name)}">
    <h3>${esc(name)}</h3><div class="qr">${loading}</div><div class="path">${esc(url)}</div>
    <div class="links" style="justify-content:center">
      ${navigator.share ? `<button class="act on" data-share-do="send">Envoyer</button>` : ""}
      <button class="act" data-share-do="copy">Copier</button><button class="act" data-share-do="close">Fermer</button></div></div>`;
  box.dataset.url = url;
  box.dataset.name = name;
  box.hidden = false;
  box.querySelector("button").focus();
  try {
    qrLib ??= new Promise((ok, fail) => document.head.append(Object.assign(document.createElement("script"), { src: QR_LIB, onload: ok, onerror: fail })));
    await qrLib;
    const qr = qrcode(0, "M");
    qr.addData(url);
    qr.make();
    box.querySelector(".qr").innerHTML = qr.createSvgTag({ cellSize: 6, margin: 3, scalable: true });
  } catch {
    qrLib = null;
    box.querySelector(".qr").innerHTML = `<p class="empty">// QR code indisponible hors connexion</p>`;
  }
}

async function shareAction(what) {
  const box = document.getElementById("share");
  const { url, name } = box.dataset;
  if (what === "close") { box.hidden = true; return; }
  try {
    if (what === "send") await navigator.share({ title: name, url });
    if (what === "copy") {
      await navigator.clipboard.writeText(url);
      box.querySelector("[data-share-do=copy]").textContent = "Copié";
    }
  } catch {}  // share sheet closed, or clipboard refused
}
try { tab = localStorage.getItem("jarvis.tab") || tab; } catch {}
if (!TABS.some(([id]) => id === tab)) tab = "overview";

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ago = iso => {
  if (!iso) return "—";
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 3600) return `il y a ${Math.max(1, Math.round(s / 60))} min`;
  if (s < 86400) return `il y a ${Math.round(s / 3600)} h`;
  return `il y a ${Math.round(s / 86400)} j`;
};
const match = (...fields) => !query || fields.join(" ").toLowerCase().includes(query);
const appIcon = x => x.icon ? `<img class="app-icon" src="${esc(x.icon)}" alt="">` : "";
const chip = (t, cls = "") => `<span class="chip ${cls}">${esc(t)}</span>`;
// An action button; data-* attributes become the request body.
const btn = (label, args, cls = "", title = "") => TOKEN ? `<button class="act ${cls}" title="${esc(title)}" ${
  Object.entries(args).map(([k, v]) => `data-${k}="${esc(v)}"`).join(" ")}>${esc(label)}</button>` : "";

const CONFIRM = {
  toggle_plugin: d => `${d.enable === "1" ? "Activer" : "Désactiver"} le plugin « ${d.id} » ?

Jarvis va écrire dans ~/.claude/settings.json (copie de sauvegarde settings.json.jarvis.bak).`,
  toggle_mcp: d => `${d.enable === "1" ? "Activer" : "Désactiver"} le serveur MCP « ${d.name} » pour ce projet ?

Jarvis va écrire dans ~/.claude.json (copie de sauvegarde .claude.json.jarvis.bak).`,
  git_pull: d => "Lancer git pull (avance rapide uniquement) dans ce projet ?",
  git_pull_all: d => "Lancer git pull (avance rapide uniquement) dans TOUS les projets git ?",
  pc_power: d => ({ sleep: "Mettre le PC en veille ?", shutdown: "Éteindre le PC dans 60 secondes ?" })[d.mode],
};

async function act(el) {
  const d = { ...el.dataset };
  const ask = CONFIRM[d.act]?.(d);
  if (ask && !confirm(ask)) return;
  if (d.act === "rename_link") {
    d.label = prompt("Nouveau nom (vide : nom d'origine)", d.current);
    if (d.label === null) return;
  }
  const out = document.getElementById("out");
  const show = text => { out.innerHTML = `<button class="act" data-close>×</button>${esc(text)}`; out.hidden = false; };
  show(`> ${d.act}…`);
  el.disabled = true;
  try {
    const r = await fetch("/api/action", { method: "POST", body: JSON.stringify({ ...d, enable: d.enable === "1" }),
      headers: { "Content-Type": "application/json", "X-Jarvis-Token": TOKEN } });
    const j = await r.json().catch(() => ({ error: `HTTP ${r.status}` }));
    show(j.ok ? j.output : `ERREUR · ${j.error}`);
    if (j.ok && (d.act.startsWith("toggle") || d.act === "rename_link")) load();
    if (d.act.startsWith("git_pull") && tab === "git") loadExtra("git");
  } catch (e) {
    show(`ERREUR · ${e.message}`);
  }
  el.disabled = false;
}

function renderTabs() {

function setTab(t) {

// --- v3: views loaded when their tab opens, only on the local page ---
const extra = {};  // tab -> what the server sent, null while loading, or {error}
const chat = { path: "", session: "", log: [], busy: false, ctrl: null, draft: "", mic: null, micError: "" };
// Browser speech: dictation (Chrome, Edge, Safari; needs https or localhost) and spoken replies.
const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let speak = false, listen = false, ear = null;
try { speak = localStorage.getItem("jarvis.speak") === "1"; listen = localStorage.getItem("jarvis.listen") === "1"; } catch {}
const api = (url, opts = {}) => fetch(url, { ...opts, headers: { "Content-Type": "application/json", "X-Jarvis-Token": TOKEN } });
const fmt = n => n >= 1e9 ? `${(n / 1e9).toFixed(1)} G` : n >= 1e6 ? `${(n / 1e6).toFixed(1)} M` : n >= 1e3 ? `${Math.round(n / 1e3)} k` : String(n);
const loading = `<p class="empty">// chargement…</p>`;
const failed = e => `<p class="empty">// erreur : ${esc(e)}</p>`;

async function loadExtra(t, url = { usage: "/api/usage", git: "/api/git", board: "/api/board" }[t]) {
  extra[t] = null;
  if (tab === t) render();
  try {
    const r = await api(url);
    const j = await r.json();
    extra[t] = r.ok ? j : { error: j.error || `HTTP ${r.status}` };
  } catch (e) { extra[t] = { error: e.message }; }
  if (tab === t) render();
}

function chatLog() {

    || `<p class="empty">// pose une question à Claude sur ce projet</p>`;
}

function refreshChat() {
  const log = document.getElementById("chat-log");
  if (!log) return;
  log.innerHTML = chatLog();
  log.scrollTop = log.scrollHeight;
}

function chatView() {
  if (!chat.path) chat.path = data.projects[0]?.path || "";
  const options = data.projects.map(p => `<option value="${esc(p.path)}" ${p.path === chat.path ? "selected" : ""}>${esc(p.name)}</option>`).join("");
  return `<h2>Chat <span class="count">[${chat.session ? `session ${esc(chat.session.slice(0, 8))}` : "nouvelle conversation"}]</span></h2>
    <div class="toolbar"><select id="chat-project" aria-label="Projet">${options}</select>
      <button class="act" data-chat="new">Nouvelle conversation</button>
      ${chat.session && !chat.busy ? btn("Ouvrir dans un terminal", { act: "claude_resume", path: chat.path, id: chat.session }) : ""}</div>
    <div class="chat-log" id="chat-log"></div>
    <form id="chat-form">
      <textarea id="chat-input" rows="3" placeholder="> ton message_ (Ctrl+Entrée pour envoyer)" aria-label="Message" ${chat.busy ? "disabled" : ""}>${esc(chat.draft)}</textarea>
      <div class="toolbar" style="margin-top:8px">${chat.busy
        ? `<button class="act off" type="button" data-chat="stop">Stop</button>`
        : `<button class="act on" type="submit">Envoyer</button>`}
        ${Recognition && !chat.busy ? `<button class="act ${chat.mic ? "off" : ""}" type="button" data-chat="mic">${chat.mic ? "■ J'écoute…" : "Micro"}</button>` : ""}
        ${Recognition ? `<button class="act ${listen ? "on" : ""}" type="button" data-chat="listen" title="Écouter en permanence : dis « Jarvis, … »">Écoute · ${listen ? "on" : "off"}</button>` : ""}
        ${window.speechSynthesis ? `<button class="act ${speak ? "on" : ""}" type="button" data-chat="voice" title="Lire les réponses à voix haute">Voix · ${speak ? "on" : "off"}</button>` : ""}
        ${speak && frVoices().length > 1 ? `<select id="chat-voice" aria-label="Voix de Jarvis">${frVoices().map(v =>
          `<option ${v === jarvisVoice() ? "selected" : ""}>${esc(v.name)}</option>`).join("")}</select>` : ""}
        ${chat.micError ? `<span class="note">micro : ${esc(chat.micError)}</span>` : ""}</div>
    </form>
    <p class="note">Claude répond avec « claude -p » dans le dossier du projet. Ce qui demanderait ta confirmation (modifier un fichier, lancer une commande non autorisée) est refusé automatiquement : pour ça, ouvre la session dans un terminal.</p>`;
}

async function sendChat(message) {
  const reply = { role: "claude", text: "" };
  chat.log.push({ role: "user", text: message }, reply);
  chat.busy = true;
  chat.ctrl = new AbortController();
  render();
  try {
    const r = await api("/api/chat", { method: "POST", signal: chat.ctrl.signal,
      body: JSON.stringify({ path: chat.path, session: chat.session, message }) });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || `HTTP ${r.status}`);
    const reader = r.body.pipeThrough(new TextDecoderStream()).getReader();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      const lines = (buf + value).split("\n");
      buf = lines.pop();
      for (const line of lines.filter(Boolean)) {
        const ev = JSON.parse(line);
        if (ev.text) reply.text += ev.text;
        if (ev.tool) reply.text += `\n⚙ ${ev.tool}\n`;
        if (ev.session) chat.session = ev.session;
        if (ev.error && ev.error !== reply.text.trim()) reply.error = ev.error;
      }
      refreshChat();
    }
  } catch (e) {
    if (e.name !== "AbortError") reply.error = e.message;
  }
  chat.busy = false;
  if (tab === "chat") { render(); document.getElementById("chat-input")?.focus(); }
  if (speak && reply.text) talk(reply.text.replace(/^⚙ .*$/gm, ""));
}

const FILLER = ["le", "la", "les", "un", "une", "de", "du", "des", "en", "et", "mon", "ma", "mes", "moi", "stp", "dans",
  "sur", "pour", "au", "aux", "avec", "ce", "cet", "cette", "va", "vas", "me", "il", "te", "plait", "plais", "est", "qui", "que"];
// "Jarvis, ouvre Spotify": the entry sharing the most words with the order (filler words ignored).
function voiceCommand(message) {
  const m = norm(message).match(/^jarvis\b[\s,.!:]*(.+)/);
  if (!m) return false;
  const words = m[1].replace(/[^a-z0-9' ]/g, " ").split(/\s+/).filter(w => w.length > 1 && !FILLER.includes(w));
  let best = null, score = 0;
  for (const x of paletteItems()) {
    // Words of the name count double; extra keywords ("ouvre", "baisse") only break ties, never match alone.
    const t = words.filter(w => norm(x.text).includes(w)).length;
    const n = t && 2 * t + words.filter(w => norm(x.kw || "").includes(w)).length;
    if (n > score) [best, score] = [x, n];
  }
  const reply = best ? `→ ${best.text}` : "Je n'ai pas compris cet ordre. Essaie Ctrl+K pour voir les commandes.";
  chat.log.push({ role: "user", text: message }, { role: "claude", text: reply });
  render();
  if (speak) talk(reply.replace("→ ", ""));
  if (best?.href) window.open(best.href, "_blank", "noopener");  // shortcut: a popup blocker may stop it after dictation, then click the link
  else if (best) {
    const b = Object.assign(document.createElement("div"), { innerHTML: `<button ${best.attrs}></button>` }).firstChild;
    b.dataset.tab ? setTab(b.dataset.tab) : act(b);
  }
  return true;
}

// v5: Jarvis's voice, a mature woman's. Best: Edge's natural French voices (Denise, Vivienne...),
// then any French female voice; a little slower and lower than the default.
const FEMALE = /denise|vivienne|eloise|brigitte|celeste|coralie|jacqueline|yvette|josephine|hortense|julie|amelie|female|femme|google fran/i;
const NATURAL = /natural|online/i;
let voiceName = "";
try { voiceName = localStorage.getItem("jarvis.voice") || ""; } catch {}
const frVoices = () => (window.speechSynthesis?.getVoices() || []).filter(v => v.lang.startsWith("fr"));
function jarvisVoice() {
  const fr = frVoices();
  return fr.find(v => v.name === voiceName) || fr.find(v => NATURAL.test(v.name) && FEMALE.test(v.name))
    || fr.find(v => FEMALE.test(v.name)) || fr[0] || null;
}
// Edge loads its natural voices a moment after the page: refresh the voice list when they arrive.
if (window.speechSynthesis) speechSynthesis.onvoiceschanged = () => tab === "chat" && !chat.busy && render();
function talk(text) {
  speechSynthesis.cancel();
  const voice = jarvisVoice(), natural = NATURAL.test(voice?.name);
  const clean = text.replace(/```[\s\S]*?```/g, " ").replace(/\[([^\]]+)\]\([^)]*\)/g, "$1")
    .replace(/https?:\/\/\S+/g, "").replace(/[*_#`>|~]/g, "").replace(/\s*\n+\s*/g, ". ");
  // Online voices stop after ~15 s of one utterance: speak chunks of whole sentences, queued.
  const chunks = [];
  for (const s of clean.match(/[^.!?;]+[.!?;]*/g) || []) {
    if (chunks.length && chunks.at(-1).length + s.length < 220) chunks[chunks.length - 1] += s;
    else chunks.push(s);
  }
  // Natural voices sound best untouched; the old robotic ones a little slower and lower.
  for (const c of chunks.filter(c => /\w/.test(c)))
    speechSynthesis.speak(Object.assign(new SpeechSynthesisUtterance(c.trim()),
      { lang: "fr-FR", voice, rate: natural ? 1 : .95, pitch: natural ? 1 : .9 }));
}

// v5: always listening. Only a sentence containing "Jarvis" does something ("ok Jarvis, baisse le son");
// everything else heard is dropped. The browser stops after each silence, so it starts again.
function startEar() {
  if (!TOKEN || !Recognition || !listen || ear || chat.mic) return;
  ear = Object.assign(new Recognition(), { lang: "fr-FR", continuous: true });
  ear.onresult = e => {
    const r = e.results[e.results.length - 1];
    const t = r.isFinal ? r[0].transcript.trim() : "";
    const i = t.search(/\bjarvis\b/i);
    if (i >= 0 && !speechSynthesis.speaking) voiceCommand(t.slice(i));  // not Jarvis hearing its own voice
  };
  ear.onerror = e => {
    if (e.error !== "not-allowed") return;
    listen = false;
    chat.micError = "accès refusé par le navigateur";
    render();
  };
  ear.onend = () => { ear = null; setTimeout(startEar, 300); };
  ear.start();
}

function toggleMic() {
  if (chat.mic) return chat.mic.stop();
  ear?.abort();  // one recognition at a time: the always-on one resumes when dictation ends
  const rec = chat.mic = new Recognition();
  const before = chat.draft ? chat.draft + " " : "";
  rec.lang = "fr-FR";
  rec.interimResults = true;
  rec.onresult = e => {
    chat.draft = before + [...e.results].map(r => r[0].transcript).join("");
    const input = document.getElementById("chat-input");
    if (input) input.value = chat.draft;
  };
  rec.onerror = e => { chat.micError = e.error === "not-allowed" ? "accès refusé par le navigateur" : e.error; };
  rec.onend = () => {
    chat.mic = null;
    startEar();
    if (/^jarvis\b/i.test(chat.draft.trim()) && !chat.busy) { const m = chat.draft.trim(); chat.draft = ""; voiceCommand(m); }
    else if (tab === "chat") render();
  };
  chat.micError = "";
  rec.start();
  render();
}

const USAGE_KINDS = [["output", "sorties", "var(--ok)"], ["input", "entrées", "var(--warn)"],
                     ["cacheCreation", "cache écrit", "var(--cyan)"], ["cacheRead", "cache lu", "var(--cyan-dim)"]];
const total = r => USAGE_KINDS.reduce((n, [k]) => n + r[k], 0);
const sumRows = (rows, init) => rows.reduce((t, r) => (USAGE_KINDS.forEach(([k]) => t[k] += r[k]), t),
                                            { ...init, input: 0, output: 0, cacheRead: 0, cacheCreation: 0 });

function usageTable(title, rows, key) {
  const names = [...new Set(rows.map(r => r[key]))];
  const list = names.map(n => sumRows(rows.filter(r => r[key] === n), { name: n })).sort((a, b) => total(b) - total(a));
  const max = Math.max(1, ...list.map(total));
  return `<h2>${title} <span class="count">[${list.length}]</span></h2><div class="table-wrap"><table class="usage">
    <tr><th></th><th class="hbar"></th>${USAGE_KINDS.map(([, l]) => `<th>${l}</th>`).join("")}<th>total</th></tr>
    ${list.map(g => `<tr><td>${esc(g.name)}</td><td class="hbar"><i style="width:${100 * total(g) / max}%"></i></td>${
      USAGE_KINDS.map(([k]) => `<td>${fmt(g[k])}</td>`).join("")}<td>${fmt(total(g))}</td></tr>`).join("")}
  </table></div>`;
}

function usageView() {
  const u = extra.usage;
  if (!u) return `<h2>Usage</h2>${loading}`;
  if (u.error) return `<h2>Usage</h2>${failed(u.error)}`;
  const rows = u.rows.filter(r => match(r.project, r.model));
  const perDay = u.days.map(d => sumRows(rows.filter(r => r.day === d), { day: d }));
  const max = Math.max(1, ...perDay.map(total));
  const bars = perDay.map(t => `<div class="col" title="${t.day} · ${USAGE_KINDS.map(([k, l]) => `${l} ${fmt(t[k])}`).join(" · ")}">
      <div class="val">${total(t) ? fmt(total(t)) : ""}</div>
      <div class="stack" style="height:${100 * total(t) / max}%">${USAGE_KINDS.map(([k, , c]) => `<i style="flex:${t[k]};background:${c}"></i>`).join("")}</div>
      <small>${t.day.slice(8)}/${t.day.slice(5, 7)}</small></div>`).join("");
  return `<h2>Tokens par jour <span class="count">[${fmt(perDay.reduce((n, t) => n + total(t), 0))} sur ${u.days.length} j]</span></h2>
    <div class="card"><div class="bars">${bars}</div>
      <div class="toolbar note legend" style="margin:10px 0 0">${USAGE_KINDS.map(([, l, c]) => `<span><i style="background:${c}"></i>${l}</span>`).join("")}
        <span class="spacer"></span><button class="act" data-reload="usage">Actualiser</button></div></div>
    ${usageTable("Par projet", rows, "project")}
    ${usageTable("Par modèle", rows, "model")}
    <p class="note">Lu dans message.usage des sessions (sous-agents compris). Le cache lu coûte environ 10 fois moins cher qu'une entrée normale.</p>`;
}

const reEscape = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

function searchView() {
  const s = extra.search;
  const hit = h => `<li>${btn("Reprendre", { act: "claude_resume", path: h.path, id: h.session }, "", `claude --resume ${h.session}`)}
      <time>${esc(h.project)} · ${ago(h.at)} · ${h.role === "user" ? "toi" : "claude"} · ${esc(h.session.slice(0, 8))}</time>${
      esc(h.snippet).replace(new RegExp(reEscape(esc(s.q)), "gi"), m => `<mark>${m}</mark>`)}</li>`;
  const results = !s ? "" : s.loading ? loading : s.error ? failed(s.error)
    : s.hits.length ? `<div class="card"><ul class="sessions">${s.hits.map(hit).join("")}</ul></div>` : `<p class="empty">// aucun résultat</p>`;
  return `<h2>Recherche dans les sessions ${s?.hits ? `<span class="count">[${s.hits.length}${s.hits.length >= 50 ? "+" : ""}]</span>` : ""}</h2>
    <form id="search-form" class="toolbar"><input id="search-q" type="text" placeholder="> texte à chercher dans tes prompts et les réponses_" value="${esc(s?.q || "")}" aria-label="Texte à chercher">
      <button class="act on" type="submit">Chercher</button></form>${results}`;
}

async function runSearch(q) {
  extra.search = { q, loading: true };
  render();
  try {
    const r = await api(`/api/search?limit=50&q=${encodeURIComponent(q)}`);
    const j = await r.json();
    extra.search = r.ok ? { q, hits: j } : { q, error: j.error || `HTTP ${r.status}` };
  } catch (e) { extra.search = { q, error: e.message }; }
  if (tab === "search") render();
}

function gitCard(g) {
  const a = { path: g.path };
  const sync = g.upstream == null ? chip("pas de branche distante")
    : chip(`↑ ${g.ahead} à pousser`, g.ahead ? "warn" : "ok") + chip(`↓ ${g.behind} en retard`, g.behind ? "warn" : "ok");
  return `<div class="card">
    <h3>${esc(g.name)} ${chip(`git · ${g.branch}`, "accent")}</h3>
    <div class="path">${esc(g.path)}${g.upstream ? ` → ${esc(g.upstream)}` : ""}</div>
    <div class="row">${sync}${chip(`${g.dirty.length} modif.`, g.dirty.length ? "warn" : "ok")}</div>
    ${g.dirty.length ? `<p class="path">${g.dirty.slice(0, 8).map(esc).join("<br>")}${g.dirty.length > 8 ? `<br>… +${g.dirty.length - 8}` : ""}</p>` : ""}
    <div class="row">${g.branches.map(b => chip(b, b === g.branch ? "accent" : "")).join("")}</div>
    <div class="links">${btn("Git statut", { act: "git_status", ...a })}${btn("Git pull", { act: "git_pull", ...a })}</div>
  </div>`;
}

function gitView() {
  const g = extra.git;
  const tools = `<div class="toolbar"><button class="act" data-reload="git">Actualiser</button>
    <button class="act" data-reload="git-fetch" title="git fetch dans chaque projet, puis recompte">Fetch + actualiser</button>
    ${btn("Tout pull", { act: "git_pull_all" }, "on", "git pull --ff-only dans chaque projet")}</div>`;
  if (!g) return `<h2>Bilan git</h2>${tools}${loading}`;
  if (g.error) return `<h2>Bilan git</h2>${tools}${failed(g.error)}`;
  return section("Bilan git", g.filter(r => match(r.name, r.branch, ...r.branches)).map(gitCard)).replace("</h2>", `</h2>${tools}`)
    + `<p class="note">Avance et retard comparés à la dernière copie locale de la branche distante : « Fetch + actualiser » la met à jour d'abord.</p>`;
}

// --- « Mes projets » : every folder of projects.json, newest activity first ---
let boardDomain = "";
const daysAgo = iso => Math.floor((Date.now() - new Date(iso)) / 864e5);

function boardCard(p) {
  const g = p.git;
  if (!p.exists) return `<div class="card"><h3>${esc(p.name)} ${chip("introuvable", "warn")}</h3>
    <div class="row">${chip(p.domain)}</div><div class="path">${esc(p.path)}</div></div>`;
  const dormant = !p.modified || daysAgo(p.modified) > 30;
  return `<div class="card">
    <h3>${esc(p.name)} ${dormant ? chip("dormant", "warn") : ""}</h3>
    <div class="row">${chip(p.domain)}${chip(p.modified ? `modifié ${ago(p.modified)}` : "vide")}
      ${g ? chip(`git · ${g.branch}`, "accent") + chip(`${g.dirty} modif.`, g.dirty ? "warn" : "ok") : chip("pas de git")}</div>
    <div class="path">${esc(p.path)}</div>
    ${g && g.commitDate ? `<p class="path">Dernier commit ${ago(g.commitDate)} (${esc(g.commitDate.slice(0, 10))}) : ${esc(g.commitMsg)}</p>` : ""}
  </div>`;
}

function boardView() {
  const b = extra.board;
  const tools = `<div class="toolbar"><button class="act" data-reload="board">Actualiser</button></div>`;
  if (!b) return `<h2>Mes projets</h2>${tools}${loading}`;
  if (b.error) return `<h2>Mes projets</h2>${tools}${failed(b.error)}`;
  const domains = [...new Set(b.map(p => p.domain))];
  const filters = `<div class="toolbar">${["", ...domains].map(d =>
    `<button class="act ${d === boardDomain ? "on" : ""}" data-domain="${esc(d)}">${esc(d || "Tous")}</button>`).join("")}</div>`;
  const list = b.filter(p => (!boardDomain || p.domain === boardDomain) && match(p.name, p.domain, p.path));
  return section("Mes projets", list.map(boardCard)).replace("</h2>", `</h2>${tools}${filters}`)
    + `<p class="note">Liste dans projects.json. Activité = fichier le plus récent (hors node_modules et .git) ; « dormant » au-delà de 30 jours.</p>`;
}

// --- v4: PC state on the home HUD (local page only), refreshed every 5 s while visible ---
let pcHtml = "";
async function pcState() {
  if (!document.getElementById("pc") || document.hidden) return;
  try {
    const s = await (await api("/api/system")).json();
    const gauge = (label, v, title = "") => v == null ? "" : `<span title="${title}">${label}<b>${v} %</b><i style="--v:${v}%"></i></span>`;
    pcHtml = gauge("Processeur", s.cpu) + gauge("Mémoire", s.mem) + gauge("Disque", s.disk, `${s.diskFreeGb} Go libres`);
    document.getElementById("pc").innerHTML = pcHtml;
  } catch {}
}
if (TOKEN) setInterval(pcState, 5000);

// --- v4: command bar (Ctrl+K). Entries reuse the page's own data-tab / data-act / link handling. ---
let palSel = 0, apps = [];
startEar();  // back on at each opening if it was on
if (TOKEN) api("/api/apps").then(r => r.ok && r.json()).then(a => apps = a || []).catch(() => {});
const norm = t => t.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
// v5: the PC itself. kw = extra words for typing and voice ("Jarvis, baisse le son").
const PC_ITEMS = [
  ["Son · plus fort", "pc_volume", "dir", "up", "monte augmente volume"],
  ["Son · moins fort", "pc_volume", "dir", "down", "baisse diminue volume"],
  ["Son · couper ou remettre", "pc_volume", "dir", "mute", "coupe muet volume"],
  ["PC · Verrouiller", "pc_power", "mode", "lock", "verrouille bloque"],
  ["PC · Mettre en veille", "pc_power", "mode", "sleep", "dors veille"],
  ["PC · Éteindre (dans 60 s)", "pc_power", "mode", "shutdown", "eteins arrete arret"],
  ["PC · Annuler l'arrêt", "pc_power", "mode", "cancel", "annule"],
];
function paletteItems() {
  const items = TABS.map(([id, label]) => ({ text: label, hint: "onglet", attrs: `data-tab="${id}"` }));
  if (TOKEN) {
    for (const [text, a, k, v, kw] of PC_ITEMS) items.push({ text, kw, hint: "PC", attrs: `data-act="${a}" data-${k}="${v}"` });
    for (const name of apps) items.push({ text: `Ouvrir · ${name}`, kw: "ouvre lance", hint: "app", attrs: `data-act="pc_open" data-name="${esc(name)}"` });
  }
  for (const p of data?.projects || []) {
    if (TOKEN && p.exists) for (const [label, a] of [["Claude ▶", "claude_new"], ["Éditeur", "open_editor"], ["Dossier", "open_explorer"]])
      items.push({ text: `${p.name} · ${label}`, hint: "action", attrs: `data-act="${a}" data-path="${esc(p.path)}"` });
    for (const l of visibleLinks(p)) items.push({ text: `${l.name || p.name} · ${l.label}`, hint: "lien", href: l.url });
  }
  return items.filter((x, i, all) => all.findIndex(o => o.text === x.text && o.href === x.href && o.attrs === x.attrs) === i);
}
function renderPalette() {
  const words = norm(document.getElementById("pal-q").value).split(/\s+/).filter(Boolean);
  const items = paletteItems().filter(x => words.every(w => norm(`${x.text} ${x.kw || ""}`).includes(w))).slice(0, 12);
  palSel = Math.max(0, Math.min(palSel, items.length - 1));
  document.getElementById("pal-list").innerHTML = items.map((x, i) => {
    const cls = `pal-item${i === palSel ? " sel" : ""}`, body = `<span>${esc(x.text)}</span><small>${x.hint}</small>`;
    return x.href ? `<a class="${cls}" href="${esc(x.href)}" target="_blank" rel="noopener">${body}</a>`
                  : `<button class="${cls}" ${x.attrs}>${body}</button>`;
  }).join("") || `<p class="empty">// rien ne correspond</p>`;
}
function openPalette() {
  const box = document.getElementById("palette");
  box.innerHTML = `<div class="palette-box" role="dialog" aria-modal="true" aria-label="Commandes">
    <div class="toolbar"><input id="pal-q" placeholder="Projet, onglet ou action…" autocomplete="off" aria-label="Commande"></div>
    <div id="pal-list"></div></div>`;
  box.hidden = false;
  palSel = 0;
  renderPalette();
  document.getElementById("pal-q").focus();
}

const LOCAL_VIEWS = { board: boardView, chat: chatView, usage: usageView, search: searchView, git: gitView };

function render() {
  renderTabs();
  const app = document.getElementById("app");
  if (tab === "roadmap") { app.innerHTML = roadmapView(); return; }
  if (!data) return;
  if (LOCAL_VIEWS[tab]) {
    if (["usage", "git", "board"].includes(tab) && !(tab in extra)) return loadExtra(tab);
    app.innerHTML = LOCAL_VIEWS[tab]();
    if (tab === "chat") refreshChat();
    return;
  }
  const projects = data.projects.filter(p => match(p.name, p.path, ...p.sessions.map(s => s.firstPrompt || "")));
  const skills = allSkills().filter(s => match(s.name, s.description, s.source));
  const mcp = allMcp().filter(m => match(m.name, m.command || "", m.url || "", m.scope));
  const plugins = data.plugins.filter(p => match(p.id, ...p.skills, ...p.commands, ...p.agents));
  const extras = [...data.agents, ...data.commands].filter(s => match(s.name, s.description, s.source));
  let html = "";

  if (tab === "overview") {
    const totalSessions = data.projects.reduce((n, p) => n + p.sessionCount, 0) + data.scratchSessionCount;
    const stat = (t, n, l) => `<div class="stat" data-goto="${t}"><b>${n}</b><small>${l}</small></div>`;
    html += `<section class="hero">
      <div class="hud-col left">
        ${stat("projects", data.projects.length, "projets")}
        ${stat("skills", allSkills().length, "skills")}
        ${stat("projects", totalSessions, "sessions")}
      </div>
      <div class="reactor" aria-hidden="true">
        <div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div>
        <div class="ring r4"></div><div class="ring r5"></div>
        <div class="label">J.A.R.V.I.S</div>
        <div class="sub">v4 · ONLINE</div>
      </div>
      <div class="hud-col right">
        ${stat("mcp", allMcp().length, "serveurs MCP")}
        ${stat("plugins", data.plugins.length, "plugins")}
        ${stat("roadmap", ROADMAP.filter(ph => !ph.live).length, "évolutions prévues")}
      </div>
    </section>
    ${TOKEN ? `<div class="pc" id="pc">${pcHtml}</div>` : ""}
    <div class="status-line"><span class="dot"></span>${SNAPSHOT
      ? `INSTANTANÉ EN LIGNE · MIS À JOUR ${esc(ago(data.generatedAt).toUpperCase())}`
      : "TOUS LES SYSTÈMES OPÉRATIONNELS"} · ${esc(data.account.email || "")}</div>`;
    app.innerHTML = html;  // the home page is just the HUD
    if (TOKEN && !pcHtml) pcState();
    return;
  } else if (tab === "quick") {
    html += quickAccess();
  } else if (tab === "projects") {
    html += section("Projets", projects.map(projectCard));
    html += `<p class="note">${data.scratchSessionCount} sessions « sans dossier » ne sont pas listées ici.</p>`;
  } else if (tab === "skills") {
    html += section("Skills", skills.map(itemCard));
    html += section("Agents & commandes", extras.map(itemCard), "// aucun agent ni commande personnalisés");
  } else if (tab === "mcp") {
    html += section("Serveurs MCP", mcp.map(mcpCard));
    html += `<p class="note">Les connecteurs de l'app Claude (Docs, Chrome, navigateur intégré…) sont gérés par l'app et n'apparaissent pas dans ces fichiers. Les valeurs secrètes (env, headers, query string) ne sont jamais lues.</p>`;
  } else if (tab === "plugins") {
    html += section("Plugins", plugins.map(pluginCard));
    html += section("Marketplaces", data.marketplaces.filter(m => match(m.name, m.url || "")).map(m =>
      `<div class="card"><h3>${esc(m.name)}</h3><div class="path">${esc(m.url)}</div><p>Mis à jour ${ago(m.lastUpdated)}</p></div>`));
  } else if (tab === "config") {
    html += `<h2>Compte</h2><div class="grid"><div class="card">
      <h3>${esc(data.account.email || "—")}</h3>
      <div class="row">${chip(`install : ${data.account.installMethod || "?"}`)}${chip(`mises à jour : ${data.account.autoUpdatesChannel || "?"}`)}</div>
    </div></div>`;
    html += `<h2>CLAUDE.md global</h2>` + (data.globalClaudeMd ? `<pre>${esc(data.globalClaudeMd)}</pre>` : `<p class="empty">// aucun</p>`);
  }
  html += `<p class="note" style="margin-top:28px">// inventaire généré ${ago(data.generatedAt)} · ${TOKEN ? "actions locales actives" : "lecture seule"}</p>`;
  app.innerHTML = html;
}

async function load() {
  const app = document.getElementById("app");
  if (SNAPSHOT) { data = SNAPSHOT; render(); return; }
  try {
    const r = await fetch("/api/inventory");
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    data = await r.json();
    render();
  } catch (e) {
    app.innerHTML = `<p class="empty">// échec du chargement de l'inventaire : ${esc(e.message)}</p>`;
  }
}

document.addEventListener("click", e => {
  if (e.target.closest("[data-close]")) return (document.getElementById("out").hidden = true);
  const b = e.target.closest("button[data-act]");
  if (b) return act(b);
  const t = e.target.closest("[data-tab]");
  if (t) return setTab(t.dataset.tab);
  const g = e.target.closest("[data-goto]");
  if (g) return setTab(g.dataset.goto);
  const c = e.target.closest("[data-expand]");
  if (c) c.classList.toggle("open");
});
document.addEventListener("click", e => {
  const c = e.target.closest("[data-chat]");
  if (c?.dataset.chat === "new") { chat.ctrl?.abort(); Object.assign(chat, { session: "", log: [] }); render(); }
  if (c?.dataset.chat === "stop") chat.ctrl?.abort();
  if (c?.dataset.chat === "mic") toggleMic();
  if (c?.dataset.chat === "listen") {
    listen = !listen;
    try { localStorage.setItem("jarvis.listen", listen ? "1" : "0"); } catch {}
    chat.micError = "";
    listen ? startEar() : ear?.abort();
    render();
  }
  if (c?.dataset.chat === "voice") {
    speak = !speak;
    try { localStorage.setItem("jarvis.speak", speak ? "1" : "0"); } catch {}
    speak ? talk("Bonjour. Je suis Jarvis, à votre service.") : speechSynthesis.cancel();
    render();
  }
  const s = e.target.closest("[data-share]");
  if (s) openShare(s.dataset.share, s.dataset.name);
  const sd = e.target.closest("[data-share-do]");
  if (sd) shareAction(sd.dataset.shareDo);
  if (e.target.id === "share") shareAction("close");  // click outside the panel
  const dm = e.target.closest("[data-domain]");
  if (dm) { boardDomain = dm.dataset.domain; render(); }
  // After the first listener ran the entry's own action: close the command bar.
  if (e.target.closest(".pal-item") || e.target.id === "palette") document.getElementById("palette").hidden = true;
  const r = e.target.closest("[data-reload]");
  if (r) loadExtra(r.dataset.reload.split("-")[0], r.dataset.reload === "git-fetch" ? "/api/git?fetch=1" : undefined);
});
document.addEventListener("change", e => {
  if (e.target.id === "chat-voice") {
    voiceName = e.target.value;
    try { localStorage.setItem("jarvis.voice", voiceName); } catch {}
    return talk("Bonjour. Je suis Jarvis, à votre service.");
  }
  if (e.target.id !== "chat-project" || e.target.value === chat.path) return;
  chat.ctrl?.abort();  // a conversation belongs to one project folder
  Object.assign(chat, { path: e.target.value, session: "", log: [] });
  render();
});
document.addEventListener("submit", e => {
  e.preventDefault();
  if (e.target.id === "chat-form") {
    const message = document.getElementById("chat-input").value.trim();
    if (message && !chat.busy) { chat.draft = ""; chat.mic?.stop(); voiceCommand(message) || sendChat(message); }
  }
  if (e.target.id === "search-form") {
    const q = document.getElementById("search-q").value.trim();
    if (q.length >= 2) runSearch(q);
  }
});
document.addEventListener("input", e => {
  if (e.target.id === "chat-input") chat.draft = e.target.value;
  if (e.target.id === "pal-q") { palSel = 0; renderPalette(); }
});
document.addEventListener("keydown", e => {
  const pal = document.getElementById("palette");
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); return openPalette(); }
  if (!pal.hidden) {
    if (e.key === "Escape") pal.hidden = true;
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); palSel += e.key === "ArrowDown" ? 1 : -1; renderPalette(); }
    if (e.key === "Enter") { e.preventDefault(); pal.querySelector(".pal-item.sel")?.click(); }
    return;
  }
  if (e.key === "Escape" && !document.getElementById("share").hidden) shareAction("close");
  if (e.target.id === "chat-input" && e.key === "Enter" && (e.ctrlKey || e.metaKey)) e.target.form.requestSubmit();
});
document.getElementById("q").addEventListener("input", e => { query = e.target.value.trim().toLowerCase(); render(); });
document.getElementById("refresh").addEventListener("click", load);
document.getElementById("refresh").hidden = !!SNAPSHOT;
// "Share to Jarvis" from the phone (installed app): the shared text lands in the chat box.
const shared = new URLSearchParams(location.search);
const sharedText = ["title", "text", "url"].map(k => shared.get(k)).filter(Boolean).join("\n");
if (TOKEN && sharedText) {
  tab = "chat";
  chat.draft = sharedText;
  history.replaceState(null, "", location.pathname);
}
renderTabs();
load();
</script>
<script>
// --- Wisp, the mascot: malin, complice, taquin; flamer when spammed. Moods follow the live sessions. ---
(() => {
  const LINES = {
    idle:  ["Psst. Je traîne dans le coin.", "T'as besoin de moi ou tu fais semblant de bosser ?", "Je connais un raccourci. Comme toujours."],
    sly:   ["Hé hé. J'ai vu ce que t'as fait.", "Laisse, je gère. Enfin… on gère.", "Tu me dois une, là."],
    think: ["Laisse-moi cuire deux secondes…", "Je farm l'info, bouge pas.", "Hmm. Ça sent le plan foireux. J'adore."],
    sleep: ["zzz… pas maintenant…", "AFK. Reviens plus tard.", "Je recharge mon mana…"],
    wow:   ["Oh ? Notif fraîche, ça sent le loot.", "Attends attends attends. C'est quoi ça ?", "Ping ! Quelqu'un te cherche."],
    angry: ["Sérieux ?! T'appelles ça un build ?", "Arrête de me spam, je vais tilt !", "Gg no re. Je ragequit.", "Diff total. J'écris ton report."],
    gg:    ["GG EZ. Trop facile pour nous.", "Carry comme d'hab. Pas de quoi.", "Objectif sécurisé. Next !"],
  };
  // What a live session state means, said when it changes.
  const LIVE = { think: "Claude bosse. Je surveille.", wow: "Ping ! Une session attend ta réponse.", gg: "Session finie. GG !" };
  const el = document.getElementById("wisp"), bubble = document.getElementById("wisp-bubble");
  let hideT, sleepT, clicks = [], live = "idle";

  function say(text) {
    bubble.classList.remove("show");
    requestAnimationFrame(() => { bubble.textContent = text; bubble.classList.add("show"); });
    clearTimeout(hideT);
    hideT = setTimeout(() => bubble.classList.remove("show"), 3200);
  }
  const pick = a => a[Math.floor(Math.random() * a.length)];

  function setMood(m, talk = true) {
    el.dataset.mood = m;
    if (talk) say(pick(LINES[m]));
    // 30 s without activity: he falls asleep, unless a session is still working or waiting.
    clearTimeout(sleepT);
    if (m !== "sleep") sleepT = setTimeout(() => setMood(live === "think" || live === "wow" ? live : "sleep", false), 30000);
  }

  el.addEventListener("click", () => {
    const now = Date.now();
    clicks = clicks.filter(t => now - t < 2000).concat(now);
    if (clicks.length >= 5) { clicks = []; setMood("angry"); setTimeout(() => setMood("sly"), 4000); return; }
    if (el.dataset.mood === "angry") return;  // you don't calm a flamer down by clicking
    setMood(Math.random() < .5 ? "sly" : "idle");
  });

  // API for Jarvis and the apps: wisp("gg") or wisp("angry", "Build cassé !")
  window.wisp = (m, text) => { setMood(m, !text); if (text) say(text); };

  // Only the local server knows the sessions: the online copies keep a plain Wisp.
  const NOTIFY = { wow: "Une session Claude attend ta réponse.", gg: "Une session Claude a fini." };
  async function poll() {
    try {
      const r = await api("/api/activity");
      if (!r.ok) return;
      const { mood } = await r.json();
      if (mood === live) return;
      live = mood;
      // Polled in the background too (the browser slows it to about once a minute): that's when a notification helps.
      if (document.hidden && NOTIFY[mood] && window.Notification?.permission === "granted")
        new Notification("Jarvis", { body: NOTIFY[mood], icon: "/icon-192.png", tag: "jarvis-activity" });
      if (el.dataset.mood !== "angry") { setMood(mood, false); if (LIVE[mood]) say(LIVE[mood]); }
    } catch {}
  }
  setMood("idle", false);
  if (TOKEN) {
    poll();
    setInterval(poll, 5000);
    // Permission can only be asked after a click: the first one in the page.
    if (window.Notification?.permission === "default")
      document.addEventListener("click", () => Notification.requestPermission(), { once: true });
  }

  for (const m in LINES) console.assert(document.querySelector(".wisp .e-" + m), "humeur sans visage : " + m);
})();
</script>
