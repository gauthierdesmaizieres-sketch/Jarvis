<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jarvis</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #03070d; --bg-2: #061220; --panel: rgba(8, 26, 44, .72);
    --cyan: #3fd8ff; --cyan-dim: #1b6f8f; --cyan-faint: rgba(63, 216, 255, .12);
    --text: #d6f3ff; --muted: #6f9bb3; --ok: #4dffb8; --warn: #ffb547; --line: rgba(63, 216, 255, .28);
    --display: "Orbitron", "Segoe UI", sans-serif;
    --body: "Rajdhani", "Segoe UI", system-ui, sans-serif;
    --mono: "Share Tech Mono", Consolas, ui-monospace, monospace;
    --glow: 0 0 6px rgba(63, 216, 255, .55), 0 0 18px rgba(63, 216, 255, .25);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0; min-height: 100vh; color: var(--text); font: 16px/1.45 var(--body);
    background:
      radial-gradient(ellipse at 50% 18%, rgba(30, 120, 170, .22), transparent 60%),
      linear-gradient(var(--cyan-faint) 1px, transparent 1px) 0 0 / 40px 40px,
      linear-gradient(90deg, var(--cyan-faint) 1px, transparent 1px) 0 0 / 40px 40px,
      var(--bg);
    background-attachment: fixed;
  }
  /* Scanlines */
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 10;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 1px, transparent 1px 3px);
    mix-blend-mode: multiply;
  }

  header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: rgba(3, 7, 13, .85);
           backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
  .bar { max-width: 1240px; margin: 0 auto; padding-block: 12px;
         padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; gap: 14px;
         align-items: center; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .brand .mini-core { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--cyan);
                      box-shadow: var(--glow), inset 0 0 10px var(--cyan); position: relative; }
  .brand .mini-core::after { content: ""; position: absolute; inset: 7px; border-radius: 50%;
                             background: var(--cyan); box-shadow: 0 0 12px var(--cyan); }
  h1 { font: 700 16px var(--display); margin: 0; letter-spacing: .35em; color: var(--text);
       text-shadow: var(--glow); }
  nav { display: flex; gap: 2px; flex-wrap: wrap; }
  nav button { border: 1px solid transparent; background: none; color: var(--muted); padding: 5px 12px;
               cursor: pointer; font: 500 12px var(--display); letter-spacing: .12em; text-transform: uppercase;
               clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%); transition: color .2s, background .2s; }
  nav button:hover { color: var(--text); }
  nav button.active { color: var(--bg); background: var(--cyan); box-shadow: var(--glow); }
  .spacer { flex: 1; }
  input[type=search] { background: rgba(8, 26, 44, .8); color: var(--text); border: 1px solid var(--line);
                       padding: 7px 12px; width: 220px; font: 14px var(--mono); outline: none; }
  input[type=search]:focus { border-color: var(--cyan); box-shadow: var(--glow); }
  input[type=search]::placeholder { color: var(--muted); }
  .icon-btn { background: none; border: 1px solid var(--line); color: var(--cyan); padding: 5px 11px;
              cursor: pointer; font: 16px var(--mono); }
  .icon-btn:hover { box-shadow: var(--glow); border-color: var(--cyan); }

  main { max-width: 1240px; margin: 0 auto; padding-block: 24px 70px;
         padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); position: relative; z-index: 1; }

  /* --- Arc reactor hero --- */
  .hero { display: grid; grid-template-columns: 1fr auto 1fr; gap: 28px; align-items: center; margin: 8px 0 36px; }
  .hud-col { display: flex; flex-direction: column; gap: 14px; }
  .hud-col.left { align-items: flex-end; }
  .reactor { width: 300px; height: 300px; position: relative; display: grid; place-items: center; }
  .reactor .ring { position: absolute; border-radius: 50%; }
  .r1 { inset: 0; border: 2px solid var(--cyan-dim); box-shadow: 0 0 40px rgba(63,216,255,.15), inset 0 0 30px rgba(63,216,255,.12); }
  .r2 { inset: 14px; border: 6px dashed rgba(63,216,255,.35); animation: spin 40s linear infinite; }
  .r3 { inset: 42px; border: 2px solid var(--cyan); border-left-color: transparent; border-right-color: transparent;
        box-shadow: var(--glow); animation: spin 12s linear infinite reverse; }
  .r4 { inset: 62px; border: 10px solid transparent; border-top-color: rgba(63,216,255,.55); border-bottom-color: rgba(63,216,255,.55);
        animation: spin 7s linear infinite; }
  .r5 { inset: 86px; background: radial-gradient(circle, #0c3a52 0%, #06243a 60%, #04182a 100%);
        border: 3px solid var(--cyan); box-shadow: 0 0 30px var(--cyan), inset 0 0 30px rgba(63,216,255,.55); }
  .reactor .label { position: relative; font: 700 21px var(--display); letter-spacing: .2em; color: #eafaff;
                    text-shadow: 0 0 8px var(--cyan), 0 0 20px var(--cyan); padding-left: .2em; }
  .reactor .sub { position: absolute; bottom: 104px; font: 10px var(--mono); color: var(--cyan); letter-spacing: .3em; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 50% { opacity: .55; } }

  .stat { position: relative; min-width: 200px; padding: 10px 16px; cursor: pointer; background: var(--panel);
          border: 1px solid var(--line); clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
          transition: border-color .2s, box-shadow .2s; }
  .stat:hover { border-color: var(--cyan); box-shadow: var(--glow); }
  .stat b { display: block; font: 700 30px var(--display); color: var(--cyan); text-shadow: var(--glow); font-variant-numeric: tabular-nums; }
  .stat small { font: 12px var(--mono); color: var(--muted); letter-spacing: .15em; text-transform: uppercase; }
  .hud-col.left .stat { text-align: right; }
  /* connector lines from stats to the reactor */
  .hud-col .stat::before { content: ""; position: absolute; top: 50%; width: 28px; height: 1px; background: var(--line); }
  .hud-col.left .stat::before { right: -28px; }
  .hud-col.right .stat::before { left: -28px; }

  .status-line { font: 13px var(--mono); color: var(--muted); text-align: center; margin: -18px 0 30px; letter-spacing: .12em; }
  .status-line .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ok);
                      box-shadow: 0 0 8px var(--ok); margin-right: 8px; animation: pulse 2s ease-in-out infinite; }

  /* --- Sections & cards --- */
  h2 { font: 600 13px var(--display); letter-spacing: .25em; text-transform: uppercase; color: var(--cyan);
       margin: 34px 0 14px; display: flex; align-items: center; gap: 12px; text-shadow: var(--glow); }
  h2::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--line), transparent); }
  h2 .count { font: 13px var(--mono); color: var(--muted); text-shadow: none; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px; }
  .card { position: relative; background: var(--panel); border: 1px solid var(--line); padding: 14px 16px; min-width: 0;
          clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 0 100%); transition: border-color .2s, box-shadow .2s; }
  .card::before { content: ""; position: absolute; left: -1px; top: 12px; width: 3px; height: 24px; background: var(--cyan); box-shadow: var(--glow); }
  .card:hover { border-color: rgba(63,216,255,.6); box-shadow: inset 0 0 24px rgba(63,216,255,.08); }
  .card h3 { margin: 0 0 4px; font: 600 17px var(--body); letter-spacing: .03em; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .card p { margin: 6px 0 0; color: var(--muted); }
  .desc { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  [data-expand] { cursor: pointer; }
  .card.open .desc { -webkit-line-clamp: unset; }
  .path { font: 12px var(--mono); color: var(--cyan-dim); word-break: break-all; }
  .chip { display: inline-block; border: 1px solid var(--line); color: var(--muted); padding: 0 8px;
          font: 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; }
  .chip.ok { color: var(--ok); border-color: rgba(77,255,184,.4); }
  .chip.warn { color: var(--warn); border-color: rgba(255,181,71,.4); }
  .chip.accent { color: var(--cyan); border-color: rgba(63,216,255,.5); }
  .row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .links { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .link { font: 600 12px var(--display); letter-spacing: .08em; text-transform: uppercase; text-decoration: none;
          color: var(--cyan); border: 1px solid rgba(63,216,255,.5); padding: 4px 10px;
          clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%); transition: background .2s, color .2s; }
  .link:hover { background: var(--cyan); color: var(--bg); box-shadow: var(--glow); }
  .link.web { background: rgba(63,216,255,.16); }
  .link.local { color: var(--warn); border-color: rgba(255,181,71,.45); }
  .link.local:hover { background: var(--warn); color: var(--bg); }
  .link.local::after { content: " · PC"; opacity: .7; }
  .act { font: 600 11px var(--display); letter-spacing: .08em; text-transform: uppercase; cursor: pointer;
         color: var(--text); background: rgba(63,216,255,.06); border: 1px solid var(--line); padding: 4px 9px;
         clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%); transition: background .2s, color .2s; }
  .act:hover { background: var(--cyan); color: var(--bg); box-shadow: var(--glow); }
  .act.on { color: var(--ok); border-color: rgba(77,255,184,.45); }
  .act.off { color: var(--warn); border-color: rgba(255,181,71,.45); }
  .act:disabled { opacity: .5; cursor: wait; }
  ul.sessions .act { float: right; margin-left: 8px; }
  #out { position: fixed; z-index: 6; right: 16px; bottom: 16px; width: min(520px, calc(100% - 32px)); margin: 0;
         max-height: 40vh; overflow: auto; background: rgba(3, 7, 13, .94); border-color: var(--cyan); box-shadow: var(--glow); }
  #out button { float: right; }
  .quick { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
  .quick-item { display: flex; flex-direction: column; gap: 2px; padding: 14px 16px; text-decoration: none;
                color: var(--text); background: rgba(63,216,255,.08); border: 1px solid rgba(63,216,255,.5);
                clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
                transition: background .2s, box-shadow .2s; }
  .quick-item b { font: 600 15px var(--display); letter-spacing: .08em; display: flex; align-items: center; gap: 8px; }
  .app-icon { width: 26px; height: 26px; border-radius: 50%; flex: none; }
  .quick-item small { font: 12px var(--mono); color: var(--cyan); letter-spacing: .1em; text-transform: uppercase; }
  .quick-item:hover, .quick-item:focus-visible { background: rgba(63,216,255,.2); box-shadow: var(--glow); outline: none; }
  .quick-item.local { border-color: rgba(255,181,71,.45); background: rgba(255,181,71,.06); }
  .quick-item.local small { color: var(--warn); }
  a:focus-visible, button:focus-visible, .stat:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  ul.sessions { list-style: none; padding: 0; margin: 10px 0 0; border-top: 1px dashed var(--line); }
  ul.sessions li { padding: 7px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
  ul.sessions time { color: var(--cyan-dim); font: 11px var(--mono); display: block; letter-spacing: .08em; }
  pre { background: var(--panel); border: 1px solid var(--line); padding: 14px; white-space: pre-wrap; word-break: break-word;
        font: 13px var(--mono); color: var(--text); }
  .empty { color: var(--muted); font: 13px var(--mono); }
  .note { color: var(--muted); font: 12px var(--mono); letter-spacing: .04em; }

  /* --- Roadmap --- */
  .roadmap { position: relative; display: grid; gap: 18px; padding-left: 34px; }
  .roadmap::before { content: ""; position: absolute; left: 11px; top: 8px; bottom: 8px; width: 2px;
                     background: linear-gradient(var(--cyan), var(--cyan-dim) 30%, rgba(63,216,255,.1)); }
  .phase { position: relative; }
  .phase .node { position: absolute; left: -34px; top: 14px; width: 24px; height: 24px; border-radius: 50%;
                 border: 2px solid var(--cyan-dim); background: var(--bg); }
  .phase.live .node { border-color: var(--cyan); box-shadow: var(--glow); }
  .phase.live .node::after { content: ""; position: absolute; inset: 5px; border-radius: 50%; background: var(--cyan); animation: pulse 2s infinite; }
  .phase .card h3 { font: 700 15px var(--display); letter-spacing: .12em; }
  .phase:not(.live) .card { opacity: .82; }
  .phase ul { margin: 10px 0 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 6px 18px; }
  .phase li { padding-left: 16px; position: relative; color: var(--text); }
  .phase li::before { content: "›"; position: absolute; left: 0; color: var(--cyan); }
  .phase li small { display: block; color: var(--muted); font-size: 13px; }

  @media (max-width: 900px) {
    .hero { grid-template-columns: 1fr; justify-items: center; }
    .hud-col { flex-direction: row; flex-wrap: wrap; justify-content: center; }
    .hud-col.left { align-items: stretch; order: 2; }
    .hud-col.right { order: 3; }
    .hud-col .stat::before { display: none; }
    .hud-col.left .stat { text-align: left; }
    .stat { min-width: 150px; }
  }
  @media (max-width: 600px) {
    .bar { gap: 10px; }
    nav { order: 3; width: 100%; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
    nav button { flex: none; }
    .spacer { display: none; }
    input[type=search] { flex: 1; width: auto; min-width: 0; }
    .grid { grid-template-columns: 1fr; }
    .reactor { width: 240px; height: 240px; }
    .r5 { inset: 66px; } .r4 { inset: 46px; } .r3 { inset: 30px; }
    .reactor .label { font-size: 16px; } .reactor .sub { bottom: 80px; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand" data-tab="overview"><div class="mini-core"></div><h1>JARVIS</h1></div>
    <nav id="tabs"></nav>
    <div class="spacer"></div>
    <input type="search" id="q" placeholder="> filtrer_" aria-label="Filtrer">
    <button class="icon-btn" id="refresh" title="Recharger l'inventaire">↻</button>
  </div>
</header>
<pre id="out" hidden></pre>
<main id="app"><p class="empty">// initialisation des systèmes…</p></main>

<script>
const TABS = [
  ["overview", "Accueil"], ["projects", "Projets"], ["skills", "Skills"],
  ["mcp", "MCP"], ["plugins", "Plugins"], ["config", "Config"], ["roadmap", "Évolutions"],
];
const ROADMAP = [
  { v: "v1", title: "Inventaire", status: "En ligne", live: true, items: [
    ["Projets & sessions", "Activité, état git, premiers prompts"],
    ["Skills, agents, commandes", "Utilisateur, plugins et projets, avec stats d'usage"],
    ["Serveurs MCP & plugins", "Sans jamais exposer les secrets"],
    ["Config globale", "Compte, CLAUDE.md, marketplaces"],
  ]},
  { v: "v2", title: "Actions", status: "En ligne", live: true, items: [
    ["Ouvrir un projet", "Dans l'éditeur ou l'explorateur en un clic"],
    ["Lancer Claude dans un projet", "Nouvelle session directement depuis la carte"],
    ["Reprendre une session", "claude --resume sur une session listée"],
    ["Activer / désactiver", "Serveurs MCP et plugins, avec confirmation"],
    ["Git rapide", "Statut, pull, dernier commit par projet"],
  ]},
  { v: "v3", title: "Cerveau", status: "Prévu", items: [
    ["Chat intégré", "Via le Claude Agent SDK, avec tous tes skills et MCP"],
    ["Routage intelligent", "Jarvis choisit le projet et le skill adaptés à la demande"],
    ["Mémoire", "Se souvient de tes préférences et de l'état des projets"],
    ["Tâches planifiées", "Brief du matin, veille, rappels"],
  ]},
  { v: "v4", title: "Voix", status: "Prévu", items: [
    ["Mot d'éveil « Jarvis »", "Écoute locale, sans envoi en continu"],
    ["Reconnaissance vocale", "Whisper en local"],
    ["Synthèse vocale", "Réponses parlées"],
    ["Mode HUD", "Plein écran ou overlay, raccourci clavier global"],
  ]},
];

// Set by snapshot.py in the online copy, which works without the PC.
const SNAPSHOT = window.JARVIS_DATA || null;
// Only the local server puts a token in the page: no token, no action buttons.
const TOKEN = !SNAPSHOT && window.JARVIS_TOKEN;
let data = null, tab = "overview", query = "";
// localhost links only make sense on the PC that serves them.
const visibleLinks = p => (p.links || []).filter(l => !(SNAPSHOT && l.kind === "local"));

function quickAccess() {
  const items = data.projects.flatMap(p => visibleLinks(p)
    .filter(l => l.kind === "web" || l.kind === "custom" || (l.kind === "local" && !SNAPSHOT))
    .map(l => ({ ...l, project: p.name, icon: p.icon })));
  if (!items.length) return "";
  return `<h2>Accès rapide <span class="count">[${items.length}]</span></h2><div class="quick">${items.map(l =>
    `<a class="quick-item ${l.kind}" href="${esc(l.url)}" target="_blank" rel="noopener">
       <b>${appIcon(l)}${esc(l.project)}</b><small>${esc(l.label.replace(/^.*· /, ""))} ↗</small></a>`).join("")}</div>`;
}
try { tab = localStorage.getItem("jarvis.tab") || tab; } catch {}

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ago = iso => {
  if (!iso) return "—";
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 3600) return `il y a ${Math.max(1, Math.round(s / 60))} min`;
  if (s < 86400) return `il y a ${Math.round(s / 3600)} h`;
  return `il y a ${Math.round(s / 86400)} j`;
};
const match = (...fields) => !query || fields.join(" ").toLowerCase().includes(query);
const appIcon = x => x.icon ? `<img class="app-icon" src="${esc(x.icon)}" alt="">` : "";
const chip = (t, cls = "") => `<span class="chip ${cls}">${esc(t)}</span>`;
// An action button; data-* attributes become the request body.
const btn = (label, args, cls = "", title = "") => TOKEN ? `<button class="act ${cls}" title="${esc(title)}" ${
  Object.entries(args).map(([k, v]) => `data-${k}="${esc(v)}"`).join(" ")}>${esc(label)}</button>` : "";

const CONFIRM = {
  toggle_plugin: d => `${d.enable === "1" ? "Activer" : "Désactiver"} le plugin « ${d.id} » ?

Jarvis va écrire dans ~/.claude/settings.json (copie de sauvegarde settings.json.jarvis.bak).`,
  toggle_mcp: d => `${d.enable === "1" ? "Activer" : "Désactiver"} le serveur MCP « ${d.name} » pour ce projet ?

Jarvis va écrire dans ~/.claude.json (copie de sauvegarde .claude.json.jarvis.bak).`,
  git_pull: d => "Lancer git pull (avance rapide uniquement) dans ce projet ?",
};

async function act(el) {
  const d = { ...el.dataset };
  if (CONFIRM[d.act] && !confirm(CONFIRM[d.act](d))) return;
  const out = document.getElementById("out");
  const show = text => { out.innerHTML = `<button class="act" data-close>×</button>${esc(text)}`; out.hidden = false; };
  show(`> ${d.act}…`);
  el.disabled = true;
  try {
    const r = await fetch("/api/action", { method: "POST", body: JSON.stringify({ ...d, enable: d.enable === "1" }),
      headers: { "Content-Type": "application/json", "X-Jarvis-Token": TOKEN } });
    const j = await r.json().catch(() => ({ error: `HTTP ${r.status}` }));
    show(j.ok ? j.output : `ERREUR · ${j.error}`);
    if (j.ok && d.act.startsWith("toggle")) load();
  } catch (e) {
    show(`ERREUR · ${e.message}`);
  }
  el.disabled = false;
}

function renderTabs() {
  document.getElementById("tabs").innerHTML = TABS.map(([id, label]) =>
    `<button data-tab="${id}" class="${id === tab ? "active" : ""}">${label}</button>`).join("");
}

function setTab(t) {
  tab = t;
  try { localStorage.setItem("jarvis.tab", t); } catch {}
  render();
}

function section(title, items, empty = "// rien ici") {
  return `<h2>${title} <span class="count">[${items.length}]</span></h2>` +
    (items.length ? `<div class="grid">${items.join("")}</div>` : `<p class="empty">${empty}</p>`);
}

function projectCard(p) {
  const g = p.git;
  const chips = [
    p.exists ? "" : chip("dossier introuvable", "warn"),
    g ? chip(`git · ${g.branch}`, "accent") : chip("pas de git"),
    g && g.dirtyFiles ? chip(`${g.dirtyFiles} modif.`, "warn") : "",
    p.hasClaudeMd ? chip("CLAUDE.md", "ok") : "",
    p.mcpServers.length ? chip(`${p.mcpServers.length} MCP`) : "",
    p.skills.length ? chip(`${p.skills.length} skills`) : "",
    chip(`${p.sessionCount} session${p.sessionCount > 1 ? "s" : ""}`),
  ].join("");
  const links = visibleLinks(p).map(l =>
    `<a class="link ${l.kind}" href="${esc(l.url)}" target="_blank" rel="noopener" title="${esc(l.url)}">${esc(l.label)}</a>`).join("");
  const sessions = p.sessions.filter(s => s.firstPrompt).slice(0, 3).map(s =>
    `<li>${btn("Reprendre", { act: "claude_resume", path: p.path, id: s.id }, "", `claude --resume ${s.id}`)}<time>${ago(s.updatedAt)} · ${s.sizeKb} Ko</time>${esc(s.firstPrompt)}</li>`).join("");
  const a = { path: p.path };
  const actions = TOKEN && p.exists ? `<div class="links">
    ${btn("Dossier", { act: "open_explorer", ...a }, "", "Ouvrir dans l'explorateur Windows")}
    ${btn("Éditeur", { act: "open_editor", ...a }, "", "Ouvrir dans VS Code")}
    ${btn("Claude ▶", { act: "claude_new", ...a }, "on", "Nouvelle session Claude Code dans un terminal")}
    ${g ? btn("Git statut", { act: "git_status", ...a }) + btn("Git pull", { act: "git_pull", ...a }) : ""}
  </div>` : "";
  // Servers Claude Code loads in this project: user-wide ones plus the project's own.
  const mcpToggles = TOKEN ? [...data.mcpServers.filter(m => m.scope === "user"), ...p.mcpServers].map(m => {
    const on = !(p.disabledMcp || []).includes(m.name);
    return btn(`MCP ${m.name} · ${on ? "on" : "off"}`, { act: "toggle_mcp", ...a, name: m.name, enable: on ? 0 : 1 }, on ? "on" : "off");
  }).join("") : "";
  return `<div class="card">
    <h3>${appIcon(p)}${esc(p.name)}</h3>
    <div class="path">${esc(p.path)}</div>
    <div class="row">${chips}</div>
    ${links ? `<div class="links">${links}</div>` : ""}
    ${actions}
    ${mcpToggles ? `<div class="links">${mcpToggles}</div>` : ""}
    <p>${p.lastActivity !== undefined ? `Dernière activité : ${ago(p.lastActivity)}` : ""}${g && g.lastCommit ? ` · dernier commit : ${esc(g.lastCommit.split(" ").slice(1).join(" "))}` : ""}</p>
    ${sessions ? `<ul class="sessions">${sessions}</ul>` : ""}
  </div>`;
}

function itemCard(s) {
  const used = s.usageCount ? chip(`utilisé ${s.usageCount}× · ${ago(s.lastUsedAt)}`, "ok") : "";
  return `<div class="card" data-expand>
    <h3>${esc(s.name)} ${chip(s.source, s.source === "user" ? "accent" : "")} ${used}</h3>
    <p class="desc">${esc(s.description) || "<i>Pas de description</i>"}</p>
  </div>`;
}

function mcpCard(m) {
  const target = m.url || [m.command, m.argCount ? `+${m.argCount} arg` : ""].filter(Boolean).join(" ");
  const keys = [...m.envKeys.map(k => `env:${k}`), ...m.headerKeys.map(k => `header:${k}`)];
  return `<div class="card">
    <h3>${esc(m.name)} ${chip(m.type)} ${chip(m.scope, "accent")} ${m.project ? chip(m.project) : ""}</h3>
    <div class="path">${esc(target)}</div>
    ${keys.length ? `<div class="row">${keys.map(k => chip(k)).join("")}</div>` : ""}
  </div>`;
}

function pluginCard(p) {
  const parts = [...p.skills.map(s => `skill:${s}`), ...p.commands.map(c => `/${c}`), ...p.agents.map(a => `agent:${a}`)];
  return `<div class="card">
    <h3>${esc(p.id)} ${chip(`v${p.version}`)} ${chip(p.enabled ? "activé" : "désactivé", p.enabled ? "ok" : "warn")}
      ${btn(p.enabled ? "Désactiver" : "Activer", { act: "toggle_plugin", id: p.id, enable: p.enabled ? 0 : 1 })}</h3>
    <p>Installé ${ago(p.installedAt)} · portée ${esc(p.scope)}</p>
    <div class="row">${parts.map(x => chip(x)).join("")}</div>
  </div>`;
}

function roadmapView() {
  const phases = ROADMAP.filter(ph => match(ph.v, ph.title, ...ph.items.flat())).map(ph => `
    <div class="phase ${ph.live ? "live" : ""}">
      <div class="node"></div>
      <div class="card">
        <h3>${ph.v} · ${esc(ph.title)} ${chip(ph.status, ph.live ? "ok" : "accent")}</h3>
        <ul>${ph.items.map(([t, d]) => `<li>${esc(t)}<small>${esc(d)}</small></li>`).join("")}</ul>
      </div>
    </div>`).join("");
  return `<h2>Évolutions <span class="count">[v1 → v4]</span></h2><div class="roadmap">${phases}</div>`;
}

function allMcp() {
  return [
    ...data.mcpServers,
    ...data.projects.flatMap(p => p.mcpServers.map(m => ({ ...m, project: p.name }))),
  ];
}

function allSkills() {
  return [...data.skills, ...data.projects.flatMap(p => p.skills.map(s => ({ ...s, source: `projet:${p.name}` })))];
}

function render() {
  renderTabs();
  const app = document.getElementById("app");
  if (tab === "roadmap") { app.innerHTML = roadmapView(); return; }
  if (!data) return;
  const projects = data.projects.filter(p => match(p.name, p.path, ...p.sessions.map(s => s.firstPrompt || "")));
  const skills = allSkills().filter(s => match(s.name, s.description, s.source));
  const mcp = allMcp().filter(m => match(m.name, m.command || "", m.url || "", m.scope));
  const plugins = data.plugins.filter(p => match(p.id, ...p.skills, ...p.commands, ...p.agents));
  const extras = [...data.agents, ...data.commands].filter(s => match(s.name, s.description, s.source));
  let html = "";

  if (tab === "overview") {
    const totalSessions = data.projects.reduce((n, p) => n + p.sessionCount, 0) + data.scratchSessionCount;
    const stat = (t, n, l) => `<div class="stat" data-goto="${t}"><b>${n}</b><small>${l}</small></div>`;
    html += `<section class="hero">
      <div class="hud-col left">
        ${stat("projects", data.projects.length, "projets")}
        ${stat("skills", allSkills().length, "skills")}
        ${stat("projects", totalSessions, "sessions")}
      </div>
      <div class="reactor" aria-hidden="true">
        <div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div>
        <div class="ring r4"></div><div class="ring r5"></div>
        <div class="label">J.A.R.V.I.S</div>
        <div class="sub">v2 · ONLINE</div>
      </div>
      <div class="hud-col right">
        ${stat("mcp", allMcp().length, "serveurs MCP")}
        ${stat("plugins", data.plugins.length, "plugins")}
        ${stat("roadmap", ROADMAP.filter(ph => !ph.live).length, "évolutions prévues")}
      </div>
    </section>
    <div class="status-line"><span class="dot"></span>${SNAPSHOT
      ? `INSTANTANÉ EN LIGNE · MIS À JOUR ${esc(ago(data.generatedAt).toUpperCase())}`
      : "TOUS LES SYSTÈMES OPÉRATIONNELS"} · ${esc(data.account.email || "")}</div>`;
    html += quickAccess();
    html += section("Projets récents", projects.slice(0, 4).map(projectCard));
    const recentSkills = [...skills].filter(s => s.usageCount).sort((a, b) => (b.lastUsedAt || "").localeCompare(a.lastUsedAt || ""));
    html += section("Skills utilisés récemment", recentSkills.map(itemCard), "// aucun skill utilisé pour l'instant");
  } else if (tab === "projects") {
    html += section("Projets", projects.map(projectCard));
    html += `<p class="note">${data.scratchSessionCount} sessions « sans dossier » ne sont pas listées ici.</p>`;
  } else if (tab === "skills") {
    html += section("Skills", skills.map(itemCard));
    html += section("Agents & commandes", extras.map(itemCard), "// aucun agent ni commande personnalisés");
  } else if (tab === "mcp") {
    html += section("Serveurs MCP", mcp.map(mcpCard));
    html += `<p class="note">Les connecteurs de l'app Claude (Docs, Chrome, navigateur intégré…) sont gérés par l'app et n'apparaissent pas dans ces fichiers. Les valeurs secrètes (env, headers, query string) ne sont jamais lues.</p>`;
  } else if (tab === "plugins") {
    html += section("Plugins", plugins.map(pluginCard));
    html += section("Marketplaces", data.marketplaces.filter(m => match(m.name, m.url || "")).map(m =>
      `<div class="card"><h3>${esc(m.name)}</h3><div class="path">${esc(m.url)}</div><p>Mis à jour ${ago(m.lastUpdated)}</p></div>`));
  } else if (tab === "config") {
    html += `<h2>Compte</h2><div class="grid"><div class="card">
      <h3>${esc(data.account.email || "—")}</h3>
      <div class="row">${chip(`install : ${data.account.installMethod || "?"}`)}${chip(`mises à jour : ${data.account.autoUpdatesChannel || "?"}`)}</div>
    </div></div>`;
    html += `<h2>CLAUDE.md global</h2>` + (data.globalClaudeMd ? `<pre>${esc(data.globalClaudeMd)}</pre>` : `<p class="empty">// aucun</p>`);
  }
  html += `<p class="note" style="margin-top:28px">// inventaire généré ${ago(data.generatedAt)} · ${TOKEN ? "actions locales actives" : "lecture seule"}</p>`;
  app.innerHTML = html;
}

async function load() {
  const app = document.getElementById("app");
  if (SNAPSHOT) { data = SNAPSHOT; render(); return; }
  try {
    const r = await fetch("/api/inventory");
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    data = await r.json();
    render();
  } catch (e) {
    app.innerHTML = `<p class="empty">// échec du chargement de l'inventaire : ${esc(e.message)}</p>`;
  }
}

document.addEventListener("click", e => {
  if (e.target.closest("[data-close]")) return (document.getElementById("out").hidden = true);
  const b = e.target.closest("button[data-act]");
  if (b) return act(b);
  const t = e.target.closest("[data-tab]");
  if (t) return setTab(t.dataset.tab);
  const g = e.target.closest("[data-goto]");
  if (g) return setTab(g.dataset.goto);
  const c = e.target.closest("[data-expand]");
  if (c) c.classList.toggle("open");
});
document.getElementById("q").addEventListener("input", e => { query = e.target.value.trim().toLowerCase(); render(); });
document.getElementById("refresh").addEventListener("click", load);
document.getElementById("refresh").hidden = !!SNAPSHOT;
renderTabs();
load();
</script>
</body>
</html>
